name: Skill Lifecycle

on:
  push:
    branches:
      - master
      - "release/**"
      - "eol/**"

jobs:
  register-upgrade-deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip

      - name: Register skill on master
        if: github.ref == 'refs/heads/master'
        run: python .trae/skills/pypi-release-pipeline/scripts/lifecycle.py register --target-dir .agents/skills

      - name: Upgrade skill on release branches
        if: startsWith(github.ref, 'refs/heads/release/')
        run: python .trae/skills/pypi-release-pipeline/scripts/lifecycle.py upgrade --version 1.0.${{ github.run_number }}

      - name: Deprecate skill on eol branches
        if: startsWith(github.ref, 'refs/heads/eol/')
        run: python .trae/skills/pypi-release-pipeline/scripts/lifecycle.py deprecate
